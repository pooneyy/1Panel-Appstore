services:
  stars-node:
    image: registry.cn-beijing.aliyuncs.com/ld_beijing/stars.node:1.2.6
    restart: always
    container_name: ${CONTAINER_NAME}
    network_mode: "host"
    environment:
      - SERVER_ADDR=${SERVER_ADDR}
      - ALLOW_COMMUNITY=${STARS_ACCOUNT}
      - TOKEN=${TOKEN}
    labels:
      createdBy: Apps
