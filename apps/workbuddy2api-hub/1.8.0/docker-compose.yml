services:
  wb-proxy:
    image: ghcr.io/ardeyouxipianyi/workbuddy2api-hub:v1.8.0
    ports:
      - ${PANEL_APP_PORT_HTTP}:8788
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
    container_name: ${CONTAINER_NAME}
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
