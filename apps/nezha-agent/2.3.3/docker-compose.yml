services:
  nezha-agent:
    image: kanggle/nezha-agent:v2.3.3
    container_name: ${CONTAINER_NAME}
    restart: always
    environment:
      - CLIENT_SECRET=${NZ_CLENT_SECRET}
      - SERVER=${NZ_GRPC_URL}
      - UUID=${UUID}
      - GPU=${GPU}
      - DISABLE_COMMAND_EXECUTE=${DISABLE_COMMAND_EXECUTE}
      - DISABLE_AUTO_UPDATE=true
      - DISABLE_FORCE_UPDATE=true
    volumes:
      - /etc:/etc:ro
    network_mode: host
    labels:  
      createdBy: "Apps"