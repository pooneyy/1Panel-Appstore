services:
  solara-music:
    image: aexus/solara-music:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    pull_policy: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:3001
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SOLARA_PASSWORD=${SOLARA_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
