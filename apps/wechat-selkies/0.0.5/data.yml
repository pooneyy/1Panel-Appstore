    - default: ./config
      envKey: CONFIG_PATH
      label:
        en: Config Path
        zh: 数据持久化
      required: true
      type: text
      edit: true
    - default: selkies-username
      envKey: PANEL_USER
      label:
        en: Panel Username
        zh: 面板用户名
      required: true
      type: text
      edit: true
    - default: PaSswoRd
      envKey: PANEL_PASSWORD
      label:
        en: PANEL_PASSWORD
        zh: 面板密码
      required: true
      type: password
      edit: true
      rule: paramComplexity
      random: true
