services:
  linkstack:
    image: linkstackorg/linkstack:latest
    pull_policy: always
    volumes:
      - ./data:/htdocs
    ports:
      - ${PANEL_APP_PORT_HTTP}:80
    container_name: ${CONTAINER_NAME}
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
