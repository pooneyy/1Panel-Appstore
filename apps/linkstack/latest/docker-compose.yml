services:
  linkstack:
    image: linkstackorg/linkstack:latest
    pull_policy: always
    volumes:
      - linkstack_data:/htdocs
    ports:
      - ${PANEL_APP_PORT_HTTP}:80
    container_name: ${CONTAINER_NAME}
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
volumes:
  linkstack_data:
    name: ${CONTAINER_NAME}-data
    driver: local
    driver_opts:
      type: none
      device: ./data
      o: bind
