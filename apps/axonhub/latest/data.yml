additionalProperties:
  formFields:
  - default: 8090
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: Port
    labelZh: 端口
    required: true
    rule: paramPort
    type: number
  - default: "./data"
    edit: true
    envKey: DATA_PATH
    labelEn: Data Path
    labelZh: 数据存储位置
    required: true
    type: text
  - default: ""
    edit: true
    envKey: AXONHUB_SERVER_TRACE_EXTRA_TRACE_HEADERS
    labelEn: Extra Trace Headers
    labelZh: 额外的追踪请求头
    required: false
    type: text
  - default: "true"
    edit: true
    envKey: AXONHUB_SERVER_TRACE_CLAUDE_CODE_TRACE_ENABLED
    labelEn: Claude Code Trace Enabled
    labelZh: 启用 Claude Code 追踪
    required: false
    type: select
    values:
    - label: 启用
      value: "true"
    - label: 禁用
      value: "false"
  - default: "sqlite3"
    edit: true
    envKey: AXONHUB_DB_DIALECT
    labelEn: Database Dialect
    labelZh: 数据库类型
    required: true
    type: select
    values:
    - label: SQLite3
      value: "sqlite3"
    - label: PostgreSQL
      value: "postgres"
    - label: MySQL
      value: "mysql"
  - default: "file:/app/data/axonhub.db?cache=shared&_fk=1"
    edit: true
    envKey: AXONHUB_DB_DSN
    labelEn: Database DSN
    labelZh: 数据库连接字符串
    required: true
    type: text
  - default: "memory"
    edit: true
    envKey: AXONHUB_CACHE_MODE
    labelEn: Cache Mode
    labelZh: 缓存模式
    required: true
    type: select
    values:
    - label: 内存
      value: "memory"
    - label: Redis
      value: "redis"
    - label: 两级缓存
      value: "two-level"
  - default: "127.0.0.1:6379"
    edit: true
    envKey: AXONHUB_CACHE_REDIS_ADDR
    labelEn: Redis Address
    labelZh: Redis 服务器地址
    required: false
    type: text
  - default: ""
    edit: true
    envKey: AXONHUB_CACHE_REDIS_USERNAME
    labelEn: Redis Username
    labelZh: Redis 用户名
    required: false
    type: text
  - default: ""
    edit: true
    envKey: AXONHUB_CACHE_REDIS_PASSWORD
    labelEn: Redis Password
    labelZh: Redis 密码
    required: false
    type: text
  - default: "0"
    edit: true
    envKey: AXONHUB_CACHE_REDIS_DB
    labelEn: Redis DB
    labelZh: Redis 数据库索引
    required: false
    type: number

  - default: "0 2 * * *"
    edit: true
    envKey: AXONHUB_GC_CRON
    labelEn: GC Cron Expression
    labelZh: 垃圾回收 Cron 表达式
    required: true
    type: text
